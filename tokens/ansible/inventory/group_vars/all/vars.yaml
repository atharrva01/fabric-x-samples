# =========================
# Control Node Paths
# =========================
project_dir: "{{ lookup('env', 'PROJECT_DIR') or '~/.ansible/collections/ansible_collections/hyperledger/fabricx' }}"
out_dir: "{{ project_dir }}/out"
control_node_dir: "{{ out_dir }}/control-node"
source_code_dir: "{{ control_node_dir }}/code"
cli_bin_dir: "{{ control_node_dir }}/cli"

# =========================
# Shared Paths:
# Paths on the control node where material is generated
# or collected to be shared with other nodes.
# =========================
fetched_artifacts_dir: "{{ control_node_dir }}/fetched"
config_build_dir: "{{ control_node_dir }}/config"
cryptogen_artifacts_dir: "{{ config_build_dir }}/cryptogen-artifacts"
armageddon_artifacts_dir: "{{ config_build_dir }}/armageddon-artifacts"
configtxgen_artifacts_dir: "{{ config_build_dir }}/configtxgen-artifacts"

# =========================
# Miscellaneous
# =========================
channel_id: arma
actual_host: "{{ 'localhost' if ansible_connection == 'local' else ansible_host }}"

# fxconfig's config/transfer task defaults these three addresses to actual_host (always
# "localhost", since ansible_connection is local here) - correct for ansible's own tasks running
# on the control node against docker's published ports, but wrong for the fxconfig CLI itself,
# which runs inside a *separate* transient container on the fabric_test bridge network (every
# load_generators/fxconfig host sets container_network: fabric_test). From there "localhost" is
# that transient container's own loopback, not the host machine - connection refused. Overriding
# with the real container name (ansible_host, which is just inventory_hostname) the same way the
# pre-0.9.16 role's --endpoint argument always did.
fxconfig_orderer_address: "{{ hostvars[orderer_router_host].ansible_host }}:{{ hostvars[orderer_router_host].orderer_rpc_port }}"
fxconfig_committer_sidecar_address: "{{ hostvars[committer_sidecar_host].ansible_host }}:{{ hostvars[committer_sidecar_host].committer_rpc_port }}"
fxconfig_committer_query_service_address: "{{ hostvars[committer_query_service_host].ansible_host }}:{{ hostvars[committer_query_service_host].committer_rpc_port }}"
